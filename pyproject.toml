[build-system]
requires = ["maturin==1.9.4"]
build-backend = "maturin"

[project]
name = "laura-tui"
description = "Laura is a workspace that gives your agent an API over the UI, so your agent can tile panes while you pair-program, in a web browser or the terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
