[package]
name = "laura-tui"
version = "0.7.2"
edition = "2024"
description = "Laura is a TUI workspace that provides your agent with an API over the TUI, allowing your agent to dynamically tile panes while you pair-program."
license = "MIT"
repository = "https://github.com/thomaseleff/laura-tui"
readme = "README.md"
keywords = ["tui", "terminal", "pty", "coding-agent", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Tom Eleff <eleffthomas@gmail.com>"]
# Package is laura-tui (laura is taken on PyPI; match across registries); binary stays `laura`.
# assets/nord.tmTheme is include_str!'d by src/render.rs — needed at compile time.
include = ["src/**", "build.rs", "assets/nord.tmTheme", "Cargo.toml", "Cargo.lock", "README.md", "/LICENSE", "pyproject.toml"]

[[bin]]
name = "laura"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lib]
name = "laura"
path = "src/lib.rs"

# Exact pins agree with Cargo.lock so Dependabot is the single controlled update path.
[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
interprocess = "=2.4.3"
# syntect highlights standalone code files (Nord, fg-only); default-fancy = pure-Rust regex, no oniguruma C dep, Windows-friendly.
tui-markdown = { version = "=0.3.9", default-features = false }
# Already transitive via tui-markdown at this exact pin; promoted direct for the #32 block-map
# (source-line ranges from `into_offset_iter`). Dependabot stays the update path.
pulldown-cmark = { version = "=0.13.4", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = [
    "default-fancy",
] }
portable-pty = "=0.9.0"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tui-term = "=0.3.4"
vt100 = "=0.16.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
