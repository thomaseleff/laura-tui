[package]
name = "laura-tui"
version = "0.17.1"
edition = "2024"
description = "Laura is a TUI workspace that provides your agent with an API over the TUI, allowing your agent to dynamically tile panes while you pair-program."
license = "MIT"
repository = "https://github.com/thomaseleff/laura-tui"
readme = "README.md"
keywords = ["tui", "terminal", "pty", "coding-agent", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Tom Eleff <eleffthomas@gmail.com>"]
# Package is laura-tui (laura is taken on PyPI; match across registries); binary stays `laura`.
# assets/nord.tmTheme is include_str!'d by src/render.rs, assets/web/** by src/web.rs — needed at compile time.
include = ["src/**", "build.rs", "assets/nord.tmTheme", "assets/web/**", "Cargo.toml", "Cargo.lock", "README.md", "/LICENSE", "pyproject.toml"]

[[bin]]
name = "laura"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[lib]
name = "laura"
path = "src/lib.rs"

# Exact pins agree with Cargo.lock so Dependabot is the single controlled update path.
[dependencies]
anyhow = "=1.0.104"
# Already transitive (plist, termwiz) at this exact pin; promoted direct to decode the browser
# pane's screencast frames (#107).
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
# The web app's session token (#88).
getrandom = "=0.4.3"
interprocess = "=2.4.4"
tui-markdown = { version = "=0.3.10", default-features = false }
# Already transitive via tui-markdown at this exact pin; promoted direct for the #32 block-map
# (source-line ranges from `into_offset_iter`). Dependabot stays the update path. `html` renders each block for the web app (#89).
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
# syntect highlights standalone code files (Nord, fg-only); default-fancy = pure-Rust regex, no oniguruma C dep, Windows-friendly.
syntect = { version = "=5.3.0", default-features = false, features = [
    "default-fancy",
] }
portable-pty = "=0.9.0"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tui-term = "=0.3.4"
# The web app's websocket (#88), over std sockets.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
unicode-width = "=0.2.2"
vt100 = "=0.16.2"

# Already transitive at this exact pin; promoted direct so Laura's browser dies with Laura on
# Windows (a Job Object) and Linux (PR_SET_PDEATHSIG) (#107).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
