<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laura</title>
<base target="_blank">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="style.css">
<script src="xterm.js"></script>
<script src="addon-webgl.js"></script>
<script src="addon-unicode11.js"></script>
<script src="idiomorph.js"></script>
</head>
<body>
<header id="top"><div class="l"><span class="brand">Laura</span><span class="crumb" id="folder"></span></div><button class="find tip-c" id="findbtn" data-tip="Find a pane  Ctrl+P" aria-label="Find a pane  Ctrl+P"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Find a pane</span><kbd>Ctrl</kbd><kbd>P</kbd></button><div class="r"><button class="iconbtn" id="helpbtn" data-tip="Keystrokes  Ctrl+H" aria-label="Keystrokes  Ctrl+H">?</button></div></header>
<div id="grid">
<div id="ws" tabindex="-1"></div>
<div id="notice"></div>
</div>
<div id="status"><div id="hint"></div><div id="sbar"></div></div>
<div id="veil" class="veil" hidden><div id="help" class="modal help" hidden></div><div id="popup" class="modal" hidden><input id="pq" placeholder="Find a pane by file name or id" autocomplete="off"><div id="prows"></div></div></div>
<div id="overlay" hidden><div class="box"><p id="overlay-text"></p><button id="continue" hidden>Use this tab</button></div></div>
<script src="app.js"></script>
</body>
</html>
