name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable # mirrors rust-toolchain.toml
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # Windows exercises the ConPTY path
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable # mirrors rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable # mirrors rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Proves the `cargo install --git` path compiles.
      - run: cargo build --release --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  age-gate:
    # PR-only 4-week cooldown gate: fail if a newly added/changed locked crate
    # version was published less than 28 days ago (cargo has no native exclude-newer).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject Cargo.lock deps newer than 28 days
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE"
          # Pair each package with its version (name precedes version in every block).
          pairs() { awk '/^name = /{n=$3} /^version = /{print n" "$3}' "$1" | tr -d '"'; }
          git show "origin/$BASE:Cargo.lock" > base.lock 2>/dev/null || : > base.lock
          # Entries present in the PR lock but not the base lock = added or changed.
          comm -13 <(pairs base.lock | sort -u) <(pairs Cargo.lock | sort -u) > new.txt
          cutoff=$(date -u -d '28 days ago' +%s)
          fail=0
          while read -r name version; do
            [ -z "${name:-}" ] && continue
            created=$(curl -sf -H 'User-Agent: laura-tui-ci (age-gate)' \
              "https://crates.io/api/v1/crates/$name/$version" | jq -r '.version.created_at // empty')
            if [ -z "$created" ]; then
              echo "?? $name $version — no publish date, skipping"; continue
            fi
            ts=$(date -u -d "$created" +%s)
            if [ "$ts" -gt "$cutoff" ]; then
              echo "FAIL $name $version published $created (< 28 days old)"; fail=1
            else
              echo "ok   $name $version ($created)"
            fi
          done < new.txt
          exit $fail
