name: Docs

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.14.1)"
        required: true
        type: string
  # Manual re-publish of a tag.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.14.1)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install zensical==0.0.18 # pinned: pre-1.0, API still moving
      - run: zensical build
      - name: Publish raw markdown for agents at /content/
        run: |
          mkdir -p site/content
          cp docs/*.md site/content/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
