<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laura</title>
<base target="_blank">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="style.css">
<script src="xterm.js"></script>
<script src="addon-webgl.js"></script>
<script src="addon-unicode11.js"></script>
<script src="idiomorph.js"></script>
</head>
<body>
<header id="top"><div class="l"><a class="brand tip-l" id="brand"><img class="logo" src="logo.svg" alt="Laura" width="17" height="17"></a><button class="wsw tip-l" id="wsw" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" disabled><span class="wl" id="wlabel"></span><span class="crumb" id="wroot"></span><span class="wdot w" id="wwait" role="img" aria-label="Another workspace waits for you" hidden></span><span class="caret" id="caret" hidden>▾</span></button></div><button class="find tip-c" id="findbtn" data-tip="Find a pane  Ctrl+P" aria-label="Find a pane  Ctrl+P"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Find a pane</span><kbd>Ctrl+P</kbd></button><div class="r"><button class="iconbtn key" id="helpbtn" data-tip="Keystrokes  Ctrl+H" aria-label="Keystrokes  Ctrl+H">?</button></div><div class="menu" id="menu" role="menu" aria-label="Workspaces" tabindex="-1" hidden></div></header>
<div id="grid">
<div id="ws" tabindex="-1"><div id="canvas" hidden>
<div class="calm"><img src="logo.svg" alt="" width="40" height="40"><h1>Ask your agent to show you something</h1><p>Laura shows what your agent is working on next to the chat.</p><div class="keys"><button class="iconbtn key" data-act="help" aria-label="Keystrokes  Ctrl+H">?</button> lists the keystrokes</div></div>
<div class="glance"></div>
<div class="welcome"><h1><img src="logo.svg" alt="" width="26" height="26">Welcome to Laura</h1><p>Laura shows what your agent is working on next to the chat.</p><div class="foot">For the full tour, run <code>/laura:demo</code> with your agent.</div></div>
</div></div>
<template id="steps"><div class="steps">
<div class="step"><div class="num">1</div><b>Ask to see something</b><span>Ask your agent: <i>"Show me the README."</i> Your agent opens the file in a pane.</span><div class="mini">1  # Protocol<br>2  Laura speaks NDJSON<br>3  over one socket…</div></div>
<div class="step"><div class="num">2</div><b>Comment on a line</b><span>Click a line, then press <kbd>c</kbd> and type.</span><div class="mini">2  Laura speaks NDJSON<span class="hl">3  over one socket…</span><div class="th">You: one per tab?</div></div></div>
<div class="step"><div class="num">3</div><b>Submit your review</b><span>Press <kbd>Shift+S</kbd>. Your comments go into the chat as one inline review.</span><div class="mini">[laura review · pane #1]<br>L3 &gt; [user] one per tab?</div></div>
</div></template>
<div id="notice"></div>
</div>
<div id="status"><div id="hint"></div><div id="htip" class="htip" role="tooltip" hidden>Available after the agent runs <code>laura ready</code></div><button id="sbtn" class="sbtn tip-up tip-c" hidden><span class="dot"></span><b></b><span class="say" hidden>Waiting for you</span><span class="said" hidden></span><kbd>Ctrl+`</kbd></button><div id="sbar"></div></div>
<div id="veil" class="veil" hidden><div id="help" class="modal help" hidden></div><div id="popup" class="modal" hidden><input id="pq" placeholder="Find a pane or a workspace" autocomplete="off"><div id="prows"></div></div></div>
<div id="overlay" hidden><div class="box"><p id="overlay-text"></p><div class="obtns"><button id="continue" hidden>Use this tab</button><button id="showws" hidden>Show the workspaces</button></div></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
