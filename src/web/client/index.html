<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laura</title>
<base target="_blank">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="style.css">
<script src="xterm.js"></script>
<script src="addon-webgl.js"></script>
<script src="addon-unicode11.js"></script>
<script src="idiomorph.js"></script>
</head>
<body>
<header id="top"><div class="l"><a class="brand tip-l" id="brand"><img class="logo" src="logo.svg" alt="Laura" width="17" height="17"></a><button class="wsw tip-l" id="wsw" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" disabled><span class="wl" id="wlabel"></span><span class="crumb" id="wroot"></span><span class="wdot w" id="wwait" role="img" aria-label="Another workspace waits for you" hidden></span><span class="caret" id="caret" hidden>▾</span></button></div><button class="find tip-c" id="findbtn" data-tip="Find a pane  Ctrl+P" aria-label="Find a pane  Ctrl+P"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Find a pane</span><kbd>Ctrl</kbd><kbd>P</kbd></button><div class="r"><button class="iconbtn" id="helpbtn" data-tip="Keystrokes  Ctrl+H" aria-label="Keystrokes  Ctrl+H">?</button></div><div class="menu" id="menu" role="menu" aria-label="Workspaces" tabindex="-1" hidden></div></header>
<div id="grid">
<div id="ws" tabindex="-1"></div>
<div id="notice"></div>
</div>
<div id="status"><div id="hint"></div><div id="htip" class="htip" role="tooltip" hidden>Available after the agent runs <code>laura ready</code></div><button id="sbtn" class="sbtn tip-up tip-c" hidden><span class="dot"></span><b></b><span class="say" hidden>Waiting for you</span><kbd>Ctrl</kbd><kbd>`</kbd></button><div id="sbar"></div></div>
<div id="veil" class="veil" hidden><div id="help" class="modal help" hidden></div><div id="popup" class="modal" hidden><input id="pq" placeholder="Find a pane or a workspace" autocomplete="off"><div id="prows"></div></div></div>
<div id="overlay" hidden><div class="box"><p id="overlay-text"></p><div class="obtns"><button id="continue" hidden>Use this tab</button><button id="showws" hidden>Show the workspaces</button></div></div></div>
<script src="app.js"></script>
</body>
</html>
